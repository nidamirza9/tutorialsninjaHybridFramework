# Full local Jenkins CI stack: Jenkins + Selenium standalone Chrome
# Start:  docker compose -f docker-compose.jenkins.yml up -d --build
# UI:     http://localhost:8080  (admin / admin123)
services:
  selenium-hub:
    image: selenium/standalone-chrome:4.27.0
    container_name: selenium-hub
    shm_size: 2gb
    ports:
      - "4444:4444"
    environment:
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    networks:
      ci-net:
        aliases:
          - selenium-hub

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-ci
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:rw
      - ./jenkins/casc.yaml:/var/jenkins_casc/casc.yaml:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/var/jenkins_casc/casc.yaml"
      SELENIUM_REMOTE_URL: "http://selenium-hub:4444/wd/hub"
      EXECUTION_ENV: "remote"
      HEADLESS: "true"
    depends_on:
      - selenium-hub
    networks:
      - ci-net

networks:
  ci-net:
    name: tninja_ci-net
    driver: bridge

volumes:
  jenkins_home:
