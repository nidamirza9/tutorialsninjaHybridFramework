# Lightweight Grid for CI: single standalone Chrome (more reliable than hub+node)
services:
  selenium-hub:
    image: selenium/standalone-chrome:4.27.0
    container_name: selenium-hub
    shm_size: 2gb
    ports:
      - "4444:4444"
    environment:
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_SESSION_TIMEOUT: "300"
