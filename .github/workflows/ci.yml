name: CI — Selenium Grid + Maven

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Selenium Grid
        run: |
          docker compose -f docker-compose.grid.yml up -d
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4444/status | grep -q '"ready":true\|"ready" : true'; then
              echo "Selenium Hub ready"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.grid.yml logs
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run TestNG CI suite (remote Grid)
        env:
          EXECUTION_ENV: remote
          HEADLESS: "true"
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        run: |
          mvn -B -Pci test \
            -Dexecution_env=remote \
            -Dselenium.grid.url=http://localhost:4444/wd/hub \
            -Dheadless=true \
            -DsuiteXmlFile=src/test/java/testBase/ci-suite.xml

      - name: Upload Extent + Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-and-surefire-reports
          path: |
            reports/**
            target/surefire-reports/**
          if-no-files-found: warn

      - name: Tear down Grid
        if: always()
        run: docker compose -f docker-compose.grid.yml down --remove-orphans
