name: CI — Selenium Grid + Maven

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Selenium Grid
        run: |
          docker compose -f docker-compose.grid.yml up -d
          echo "Waiting for Selenium Hub + Chrome node..."
          for i in $(seq 1 60); do
            BODY=$(curl -sf http://localhost:4444/status 2>/dev/null | tr -d ' \n' || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"ready":true'; then
              echo "Selenium Grid is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Grid failed to become ready"
          docker compose -f docker-compose.grid.yml ps
          docker compose -f docker-compose.grid.yml logs --no-color | tail -n 200
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run TestNG CI suite (remote Grid)
        env:
          EXECUTION_ENV: remote
          HEADLESS: "true"
          SELENIUM_REMOTE_URL: http://localhost:4444
        run: |
          mvn -B -Pci test \
            -Dexecution_env=remote \
            -Dselenium.grid.url=http://localhost:4444 \
            -Dheadless=true \
            -DsuiteXmlFile=src/test/java/testBase/ci-suite.xml

      - name: Upload Extent + Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-and-surefire-reports
          path: |
            reports/**
            target/surefire-reports/**
          if-no-files-found: warn

      - name: Tear down Grid
        if: always()
        run: docker compose -f docker-compose.grid.yml down --remove-orphans
